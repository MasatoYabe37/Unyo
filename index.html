<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>UNYO - P2Pオンライン対戦</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Dela+Gothic+One&family=M+PLUS+Rounded+1c:wght@500;700;800&display=swap" rel="stylesheet">
<style>
:root{
  --red:#e5383b; --blue:#2f6fde; --yellow:#f2b705; --green:#2ea44f;
  --ink:#10201a; --gold:#ffd23f;
}
*{box-sizing:border-box}
html,body{margin:0;height:100%}
html{background:#0a2a1e}
body{
  font-family:'M PLUS Rounded 1c',system-ui,sans-serif; color:#f3f7f4;
  background:radial-gradient(ellipse at 50% 40%,#22704f 0%,#124532 55%,#0a2a1e 100%) fixed;
  min-height:100vh;
}
button{font-family:inherit}
.btn{
  font-weight:800; font-size:15px; border:none; border-radius:999px; padding:10px 20px;
  background:#fff; color:var(--ink); cursor:pointer; box-shadow:0 3px 0 rgba(0,0,0,.35);
  transition:transform .1s, filter .1s; white-space:nowrap;
}
.btn:hover{filter:brightness(1.06)}
.btn:active{transform:translateY(2px); box-shadow:0 1px 0 rgba(0,0,0,.35)}
.btn:disabled{opacity:.45; cursor:not-allowed; transform:none}
.btn.primary{background:var(--gold)}
.btn.ghost{background:rgba(255,255,255,.12); color:#fff; box-shadow:none; border:1px solid rgba(255,255,255,.25)}
.btn.small{font-size:13px; padding:6px 12px}
.btn.on{background:#ff7aa2; color:#fff}
.btn.unyo{background:var(--red); color:#fff; font-family:'Dela Gothic One'; font-size:20px; letter-spacing:1px; animation:pulse 1s infinite}
.btn.call{background:#ff8c00; color:#fff; font-size:17px; animation:shake .6s infinite}
@keyframes pulse{50%{transform:scale(1.08)}}
@keyframes shake{0%,100%{transform:rotate(0)}25%{transform:rotate(-3deg)}75%{transform:rotate(3deg)}}
input{
  font-family:inherit; font-size:16px; padding:10px 14px; border-radius:12px; border:2px solid rgba(255,255,255,.3);
  background:rgba(0,0,0,.25); color:#fff; outline:none; width:100%;
}
input:focus{border-color:var(--gold)}
.logo{font-family:'Dela Gothic One'; color:var(--gold); letter-spacing:2px; text-shadow:0 4px 0 #8a5a00, 0 8px 18px rgba(0,0,0,.4)}

/* ===== Lobby ===== */
.center-wrap{min-height:100vh; display:grid; place-items:center; padding:24px}
.panel{background:rgba(0,0,0,.28); border:1px solid rgba(255,255,255,.12); border-radius:22px; padding:28px; width:min(440px,100%); backdrop-filter:blur(4px)}
.panel h1{font-size:64px; margin:0; text-align:center}
.sub{text-align:center; opacity:.8; margin:4px 0 22px; font-size:14px}
.field{margin-bottom:14px}
.field label{display:block; font-size:13px; opacity:.8; margin-bottom:6px; font-weight:700}
.row{display:flex; gap:10px; align-items:center}
.or{text-align:center; opacity:.6; margin:18px 0; font-size:13px}
.note{font-size:12px; opacity:.7; line-height:1.6; margin-top:16px}
.badge-local{display:inline-block; background:#ff7aa2; color:#fff; font-size:12px; padding:2px 10px; border-radius:99px; margin-bottom:10px}
.code{font-family:'Dela Gothic One'; font-size:40px; letter-spacing:6px; text-align:center; color:var(--gold)}
.plist{list-style:none; padding:0; margin:14px 0}
.plist li{background:rgba(255,255,255,.08); border-radius:12px; padding:10px 14px; margin-bottom:6px; display:flex; justify-content:space-between}
.tag{font-size:11px; background:rgba(255,255,255,.18); padding:2px 8px; border-radius:99px; margin-left:6px}
.spinner{display:inline-block; width:14px; height:14px; border:2px solid #fff6; border-top-color:#fff; border-radius:50%; animation:spin 1s linear infinite; vertical-align:-2px; margin-right:6px}
@keyframes spin{to{transform:rotate(360deg)}}

/* ===== Game ===== */
.game{display:flex; flex-direction:column; min-height:100vh}
.topbar{display:flex; align-items:center; gap:10px; padding:8px 14px; background:rgba(0,0,0,.25); flex-wrap:wrap}
.topbar .logo{font-size:22px; text-shadow:0 2px 0 #8a5a00}
.topbar .info{font-size:13px; opacity:.85}
.topbar .sp{flex:1}
.opps{display:flex; flex-wrap:wrap; justify-content:center; gap:12px; padding:14px}
.seat{background:rgba(0,0,0,.25); border:2px solid transparent; border-radius:16px; padding:8px 12px; min-width:150px; max-width:100%; transition:border-color .2s, box-shadow .2s}
.seat.turn{border-color:var(--gold); box-shadow:0 0 18px rgba(255,210,63,.45)}
.seat.off{opacity:.4}
.seat .nm{font-weight:800; display:flex; gap:6px; align-items:center; justify-content:space-between; font-size:14px}
.seat .cnt{font-family:'Dela Gothic One'; font-size:13px; background:#fff; color:var(--ink); border-radius:99px; padding:1px 8px}
.seat .pts{font-size:11px; opacity:.7}
.fan{display:flex; flex-wrap:wrap; margin-top:6px; padding-left:14px; row-gap:4px}
.fan .card{margin-left:-14px}
.fan .more{align-self:center; margin-left:4px; font-size:12px; opacity:.8}
.mark{font-size:11px; font-weight:800; padding:1px 7px; border-radius:99px; background:var(--red); color:#fff}
.mark.y{background:var(--gold); color:var(--ink)}

.table{flex:1; display:flex; flex-direction:column; align-items:center; justify-content:center; gap:10px; padding:8px}
.piles{display:flex; align-items:center; gap:28px}
.pile{display:flex; flex-direction:column; align-items:center; gap:6px; font-size:12px; opacity:.95}
.deck{position:relative; cursor:default}
.deck.can{cursor:pointer}
.deck.can .card{box-shadow:0 0 0 3px #fff8, 0 0 20px 4px var(--gold)}
.deck .stack{position:absolute; inset:0; transform:translate(4px,4px); z-index:-1}
.discard{position:relative; padding:6px; border-radius:22px}
.side{display:flex; flex-direction:column; gap:8px; align-items:flex-start; min-width:130px}
.chip{display:flex; align-items:center; gap:6px; background:rgba(0,0,0,.3); border-radius:99px; padding:4px 12px 4px 6px; font-size:13px; font-weight:700}
.dot{width:18px; height:18px; border-radius:50%; border:2px solid #fff}
.pending{font-family:'Dela Gothic One'; background:var(--red); color:#fff; border-radius:12px; padding:6px 12px; font-size:18px; animation:pulse 1s infinite}
.order{display:flex; flex-wrap:wrap; gap:4px; align-items:center; justify-content:center; font-size:12px; opacity:.9; max-width:640px}
.order span.o{background:rgba(0,0,0,.28); padding:2px 9px; border-radius:99px}
.order span.o.cur{background:var(--gold); color:var(--ink); font-weight:800}
.status{font-size:17px; font-weight:800; text-align:center; min-height:26px; padding:0 12px; text-shadow:0 2px 4px rgba(0,0,0,.4)}

.me{background:rgba(0,0,0,.3); border-top:1px solid rgba(255,255,255,.12); padding:10px 12px 16px}
.me.turn{box-shadow:inset 0 3px 0 var(--gold)}
.actions{display:flex; justify-content:center; gap:10px; flex-wrap:wrap; min-height:46px; align-items:center}
.mehead{display:flex; justify-content:center; gap:10px; align-items:center; font-size:13px; margin-bottom:4px; opacity:.9}
.hand{display:flex; flex-wrap:wrap; justify-content:center; gap:6px; padding-top:16px}

/* ===== Cards (UNYOオリジナルデザイン) ===== */
.card{
  --w:72px; width:var(--w); height:calc(var(--w)*1.45); border-radius:calc(var(--w)*.14);
  position:relative; flex:none; background:var(--cc,#555); border:calc(var(--w)*.045) solid #fff;
  box-shadow:0 2px 0 rgba(0,0,0,.25), 0 6px 14px rgba(0,0,0,.35);
  display:grid; place-items:center; overflow:hidden; color:#fff; user-select:none;
  font-family:'Dela Gothic One',sans-serif; transition:transform .15s, box-shadow .15s, filter .15s;
}
.card::before{
  content:''; position:absolute; inset:11% 13%; border-radius:calc(var(--w)*.09);
  background:repeating-linear-gradient(135deg,rgba(255,255,255,.18) 0 5px,transparent 5px 11px);
  border:calc(var(--w)*.025) solid rgba(255,255,255,.55);
}
.card .mid{position:relative; font-size:calc(var(--w)*.48); line-height:1; -webkit-text-stroke:calc(var(--w)*.03) rgba(0,0,0,.4); paint-order:stroke fill; text-shadow:0 calc(var(--w)*.04) 0 rgba(0,0,0,.3)}
.card .mid.ul{text-decoration:underline; text-underline-offset:4px; text-decoration-thickness:3px}
.card .cn{position:absolute; font-size:calc(var(--w)*.19); line-height:1; -webkit-text-stroke:1px rgba(0,0,0,.3); paint-order:stroke fill}
.card .tl{top:4%; left:7%} .card .br{bottom:4%; right:7%; transform:rotate(180deg)}
.c-red{--cc:var(--red)} .c-blue{--cc:var(--blue)} .c-yellow{--cc:var(--yellow)} .c-green{--cc:var(--green)}
.c-rainbow{background:conic-gradient(from 45deg,var(--red) 0 25%,var(--yellow) 0 50%,var(--green) 0 75%,var(--blue) 0 100%)}
.c-rainbow::before{background:#1b1730; inset:16% 18%; border-color:#fff}
.card.sm{--w:34px; box-shadow:0 1px 3px rgba(0,0,0,.4)}
.card.sm .cn{display:none}
.card.sm::before{border-width:1px}
.card.lg{--w:96px}
.card.playable{cursor:pointer; transform:translateY(-12px); box-shadow:0 0 0 3px rgba(255,255,255,.7), 0 0 20px 5px rgba(255,224,102,.8)}
.card.playable:hover{transform:translateY(-18px) scale(1.04)}
.card.dim{filter:brightness(.6) saturate(.7)}
.card.forced{animation:pulse .8s infinite}
.back{background:radial-gradient(circle at 30% 20%,#5a46a8,#1c1540 75%)}
.back::before{background:radial-gradient(rgba(255,255,255,.18) 1.4px,transparent 1.6px) 0 0/9px 9px; border-color:rgba(255,210,63,.6)}
.backlogo{position:relative; color:var(--gold); font-size:calc(var(--w)*.22); padding:2px 5px; border:2px solid var(--gold); border-radius:6px; background:#1c1540; letter-spacing:1px}
.card.sm .backlogo{display:none}

/* ===== Overlays ===== */
#version{position:fixed; left:8px; bottom:6px; z-index:70; font-size:11px; font-weight:700; opacity:.6; pointer-events:none; letter-spacing:.5px}
#modal:empty{display:none}
.card .mid.long{font-size:calc(var(--w)*.34)}
.card.xl{--w:150px}
.card.sm2{--w:48px}
.card.sm2 .cn{display:none}
.three-hand .card{cursor:pointer}
.unyo-zone{position:fixed; left:12px; bottom:28px; z-index:45; display:flex; flex-direction:column; gap:10px; align-items:flex-start}
.fly{position:fixed; left:0; top:0; z-index:80; pointer-events:none; margin:0 !important; --w:54px}
.cutin{position:fixed; inset:0; z-index:85; display:flex; flex-direction:column; align-items:center; justify-content:center; gap:14px; pointer-events:none;
  background:radial-gradient(circle at 50% 50%, rgba(0,0,0,.55), rgba(0,0,0,0) 60%); animation:cfade 1.1s forwards}
.cutin-card{animation:czoom 1.1s cubic-bezier(.2,.9,.3,1.3) forwards}
.cutin-text{font-family:'Dela Gothic One',sans-serif; font-size:40px; color:#fff; -webkit-text-stroke:3px rgba(0,0,0,.55); paint-order:stroke fill; text-shadow:0 5px 0 rgba(0,0,0,.35); animation:ctext 1.1s forwards; text-align:center; padding:0 12px}
.cutin-sub{font-size:15px; font-weight:800; background:rgba(0,0,0,.55); padding:3px 12px; border-radius:99px; animation:ctext 1.1s forwards}
@keyframes czoom{0%{transform:scale(.2) rotate(-25deg);opacity:0}25%{transform:scale(1.15) rotate(4deg);opacity:1}40%{transform:scale(1) rotate(0)}85%{transform:scale(1);opacity:1}100%{transform:scale(1.35);opacity:0}}
@keyframes cfade{0%{opacity:0}10%{opacity:1}85%{opacity:1}100%{opacity:0}}
@keyframes ctext{0%,15%{transform:translateY(24px) scale(.8);opacity:0}35%{transform:none;opacity:1}85%{opacity:1}100%{opacity:0}}
@media (max-width:600px){ .card.xl{--w:110px} .cutin-text{font-size:28px} }
.overlay{position:fixed; inset:0; background:rgba(0,0,0,.55); display:grid; place-items:center; z-index:50; padding:16px}
.dialog{background:#163f2f; border:2px solid rgba(255,255,255,.2); border-radius:22px; padding:22px; width:min(460px,100%); text-align:center; box-shadow:0 20px 50px rgba(0,0,0,.5)}
.dialog h2{margin:0 0 14px; font-size:20px}
.colors{display:grid; grid-template-columns:1fr 1fr; gap:12px}
.colors button{height:80px; border-radius:16px; border:3px solid #fff; color:#fff; font-size:20px; font-weight:800; cursor:pointer; text-shadow:0 2px 2px rgba(0,0,0,.4)}
.targets{display:flex; flex-direction:column; gap:8px}
.result table{width:100%; border-collapse:collapse; margin:10px 0 16px; font-size:14px}
.result td,.result th{padding:6px 8px; border-bottom:1px solid rgba(255,255,255,.15)}
.result .win{color:var(--gold); font-weight:800}
#toasts{position:fixed; top:64px; left:12px; z-index:60; display:flex; flex-direction:column; gap:6px; align-items:flex-start; pointer-events:none; width:min(80vw,340px)}
.toast{background:rgba(10,20,15,.92); border:1px solid rgba(255,255,255,.2); padding:8px 14px; border-radius:14px; font-weight:700; font-size:13px; animation:tin .25s ease-out}
.toast.err{background:#8b1e22}
.toast.out{opacity:0; transition:opacity .4s}
@keyframes tin{from{transform:translateY(-10px); opacity:0}}
.log{position:fixed; right:0; top:0; bottom:0; width:min(320px,86vw); background:rgba(5,15,10,.95); z-index:40; padding:14px; overflow:auto; font-size:13px; line-height:1.6; border-left:1px solid rgba(255,255,255,.15)}
.log div.b{color:var(--gold); font-weight:700}
.rules{width:min(560px,96vw); font-size:13.5px}
.rsec{margin:10px 0 14px}
.rsec h3{font-size:14px; color:var(--gold); margin:0 0 4px; border-bottom:1px solid rgba(255,255,255,.15); padding-bottom:3px}
.rsec ul{margin:0; padding-left:18px}
.rsec li{margin:2px 0}
.rtable{width:100%; border-collapse:collapse}
.rtable td{padding:6px 6px; border-bottom:1px solid rgba(255,255,255,.1); vertical-align:middle}
.rtable td:first-child{width:56px}
.rtable td:nth-child(2){width:110px; white-space:nowrap}
.rcount{font-size:11px; opacity:.75; font-weight:500}
.reditor{background:rgba(0,0,0,.22); border-radius:14px; padding:12px; margin:6px 0 14px}
.rhead{font-size:12px; opacity:.8; margin:8px 0 5px; font-weight:700}
.rgrid{display:grid; grid-template-columns:repeat(auto-fill,minmax(160px,1fr)); gap:6px}
.rtoggle{display:flex; align-items:center; gap:8px; background:rgba(255,255,255,.06); border:2px solid rgba(255,255,255,.12); border-radius:12px; padding:5px 8px; color:#fff; cursor:pointer; font-family:inherit; font-weight:700; font-size:12.5px; text-align:left; transition:all .15s}
.rtoggle .card{--w:26px}
.rtoggle .rl{flex:1; line-height:1.3}
.rtoggle .sw{font-size:11px; padding:1px 8px; border-radius:99px; background:rgba(255,255,255,.15); white-space:nowrap}
.rtoggle.on{border-color:var(--gold); background:rgba(255,210,63,.14)}
.rtoggle.on .sw{background:var(--gold); color:var(--ink)}
.rtoggle:not(.on){opacity:.55}
.rtoggle:not(.on) .card{filter:grayscale(1)}
.rtoggle:disabled{cursor:default}
.rcount-row{cursor:default}
.rgrid.wide{grid-template-columns:repeat(auto-fill,minmax(230px,1fr))}
.rgrid.wide .rl{white-space:nowrap}
.stepper{display:flex; align-items:center; gap:4px}
.stp{width:24px; height:24px; border-radius:50%; border:none; background:#fff; color:var(--ink); font-weight:800; font-size:15px; line-height:1; cursor:pointer; padding:0}
.stp:disabled{opacity:.3; cursor:default}
.stn{min-width:32px; text-align:center; font-size:12px; padding:1px 6px; border-radius:99px; background:rgba(255,255,255,.15)}
.rcount-row.on .stn{background:var(--gold); color:var(--ink)}
.debugbar{background:rgba(255,122,162,.18); color:#ffd0de; font-size:12px; text-align:center; padding:3px}
@media (max-width:600px){
  .card{--w:54px} .card.lg{--w:76px} .card.sm{--w:28px}
  .panel h1{font-size:48px}
  .piles{gap:16px}
  .side{min-width:0}
}
</style>
</head>
<body>
<div id="app"></div>
<div id="modal"></div>
<div id="toasts"></div>
<div id="version"></div>

<script type="module">
// =====================================================================
//  ENGINE-START  （ルールエンジン：DOMに依存しない。ホストだけが動かす）
// =====================================================================
const COLORS = ['red', 'blue', 'yellow', 'green'];
const COLOR_JA = { red: '赤', blue: '青', yellow: '黄', green: '緑', rainbow: 'レインボー' };
const SYM_JA = { skip: 'スキップ', reverse: 'リバース', draw2: 'ドロー2', draw4: 'ドロー4', draw6: 'ドロー6', draw10: 'ドロー10', wild: 'ワイルド', drawwild: 'ドローワイルド', discard: 'ディスカード' };
const DRAW_VAL = { draw2: 2, draw4: 4, draw6: 6, draw10: 10 }; // 重ねられるドロー系カード
function cardName(c) {
  if (c.color === 'rainbow') return SYM_JA[c.sym];
  return `${COLOR_JA[c.color]}の${SYM_JA[c.sym] ?? c.sym}`;
}
function shuffle(a) {
  for (let i = a.length - 1; i > 0; i--) {
    const j = Math.floor(Math.random() * (i + 1));
    [a[i], a[j]] = [a[j], a[i]];
  }
  return a;
}
// ルールのカスタマイズ：色つき特殊カードは ON/OFF、レインボーカードは枚数(0〜10)、数字カードは特殊効果の ON/OFF
const COLOR_OPTIONAL = ['skip', 'reverse', 'draw2', 'discard'];
const RAINBOW_CARDS = ['wild', 'draw4', 'draw6', 'draw10', 'drawwild'];
const RAINBOW_DEFAULT = { wild: 2, draw4: 2, draw6: 4, draw10: 2, drawwild: 2 };
const RAINBOW_MAX = 10;
const OPTIONAL_CARDS = [...COLOR_OPTIONAL, ...RAINBOW_CARDS];
const EFFECT_NUMS = ['0', '3', '7'];
function defaultRules() {
  return {
    cards: Object.fromEntries(COLOR_OPTIONAL.map(k => [k, true])),
    counts: { ...RAINBOW_DEFAULT },
    effects: Object.fromEntries(EFFECT_NUMS.map(k => [k, true])),
  };
}
function normRules(r) {
  const d = defaultRules();
  if (r && typeof r === 'object') {
    for (const k of COLOR_OPTIONAL) if (r.cards && typeof r.cards[k] === 'boolean') d.cards[k] = r.cards[k];
    for (const k of RAINBOW_CARDS) {
      const n = r.counts && Number(r.counts[k]);
      if (Number.isFinite(n)) d.counts[k] = Math.max(0, Math.min(RAINBOW_MAX, Math.round(n)));
      else if (r.cards && r.cards[k] === false) d.counts[k] = 0; // 旧バージョンの設定(ON/OFF)
    }
    for (const k of EFFECT_NUMS) if (r.effects && typeof r.effects[k] === 'boolean') d.effects[k] = r.effects[k];
  }
  return d;
}
function buildDeck(rules = defaultRules()) {
  rules = normRules(rules);
  const d = []; let id = 0;
  const add = (color, sym) => d.push({ id: id++, color, sym });
  for (const c of COLORS) {
    for (let n = 0; n <= 9; n++) { add(c, String(n)); add(c, String(n)); } // 0〜9 各2枚（常に入る）
    for (const s of COLOR_OPTIONAL) if (rules.cards[s]) { add(c, s); add(c, s); } // 各色2枚
  }
  for (const sym of RAINBOW_CARDS) for (let i = 0; i < rules.counts[sym]; i++) add('rainbow', sym); // レインボー
  return d; // 初期設定で 124枚
}

class Game {
  constructor(players, opts = {}) {
    this.players = players.map(p => ({ id: p.id, name: p.name, hand: [], connected: true, burst: false }));
    this.totals = opts.totals || {};
    this.round = opts.round || 1;
    this.rules = normRules(opts.rules);
    this.log = []; this.seq = 0;
    this.events = []; this.eseq = 0; // 演出用イベント
  }
  emit(type, data) {
    this.eseq++; this.events.push({ seq: this.eseq, type, ...data });
    if (this.events.length > 40) this.events.shift();
  }
  addLog(text, big = false) {
    this.seq++; this.log.push({ seq: this.seq, text, big });
    if (this.log.length > 80) this.log.shift();
  }
  start() {
    this.deck = shuffle(buildDeck(this.rules));
    this.discard = [];
    for (let r = 0; r < 7; r++) for (const p of this.players) p.hand.push(this.deck.pop());
    const first = this.deck.pop();              // 最初の場のカードは山札の上から
    this.discard.push(first);
    this.color = first.color === 'rainbow' ? null : first.color; // null = どの色でもOK
    this.dir = 1;
    this.turn = Math.floor(Math.random() * this.players.length);
    this.pending = 0;          // ドロー系の累積枚数
    this.pendingMin = 0;       // 重ねるのに必要な最小のドロー値
    this.dw = null;            // ドローワイルド進行中 {by, color, count}
    this.phase = 'play';       // play | color | seven | three | dwcolor | dwdraw | over
    this.forced = null;        // パスで引いたカードが出せる場合、そのカードID
    this.unyoDeclared = false; // 現在の手番プレイヤーがUNYO宣言済みか
    this.unyoTarget = null;    // UNYO忘れで指摘可能なプレイヤーID
    this.winner = null; this.roundScore = 0; this.voided = false; this.endReason = '';

// ---------- 通信レイヤー ----------
async function makeTransport(room) {
  if (LOCAL) return localTransport(room);
  let mod, lastErr;
  for (const url of TRYSTERO_URLS[S.net]) {
    try { mod = await import(url); if (mod.joinRoom) { S.diag.lib = url; break; } } catch (e) { lastErr = e; console.warn('import failed', url, e); }
  }
  if (!mod || !mod.joinRoom) throw lastErr || new Error('Trystero を読み込めませんでした');
  const config = S.net === 'nostr' ? { appId: APP_ID, relayUrls: NOSTR_RELAYS } : { appId: APP_ID };
  const r = mod.joinRoom(config, room, e => {
    console.warn('[UNYO] join error', e);
    S.diag.joinErr = (e && (e.error || e.message)) || String(e);
    render();
  });
  // リレー接続状況の監視（診断表示用）
  const getSockets = mod.getRelaySockets || mod.getTrackerSockets;
  if (getSockets) setInterval(() => {
    try {
      const socks = Object.values(getSockets() || {});
      const open = socks.filter(w => w && w.readyState === 1).length;
      const txt = `${open}/${socks.length}`;
      if (txt !== S.diag.relays) { S.diag.relays = txt; if (S.screen === 'room') render(); }
    } catch {}
  }, 1000);
  return {
    selfId: mod.selfId,
    onJoin: f => r.onPeerJoin(f),
    onLeave: f => r.onPeerLeave(f),
    action(name) {
      const a = r.makeAction(name);
      const send = Array.isArray(a) ? a[0] : a.send;
      const recv = Array.isArray(a) ? a[1] : a.receive;
      return { send: (d, to) => send(d, to ?? null), on: f => recv(f) };

function localTransport(room) {
  const selfId = Math.random().toString(36).slice(2, 10);
  const bc = new BroadcastChannel('unyo-local-' + room);
  const joinH = [], leaveH = [], acts = {}, peers = new Set();
  const addPeer = id => { if (peers.has(id)) return; peers.add(id); joinH.forEach(f => f(id)); };
  bc.onmessage = ({ data: m }) => {
    if (m.from === selfId || (m.to && m.to !== selfId)) return;
    if (m.k === 'join') { addPeer(m.from); bc.postMessage({ k: 'here', from: selfId, to: m.from }); }
    else if (m.k === 'here') addPeer(m.from);
    else if (m.k === 'leave') { if (peers.delete(m.from)) leaveH.forEach(f => f(m.from)); }
    else if (m.k === 'msg') acts[m.name]?.(m.data, m.from);
  };
  setTimeout(() => bc.postMessage({ k: 'join', from: selfId }), 60);
  addEventListener('pagehide', () => bc.postMessage({ k: 'leave', from: selfId }));
  return {
    selfId,
    onJoin: f => joinH.push(f), onLeave: f => leaveH.push(f),
    action(name) {
      return {
        send: (data, to) => bc.postMessage({ k: 'msg', name, data, from: selfId, to: to || null }),
        on: f => { acts[name] = f; },
      };
    },
    leave() { bc.postMessage({ k: 'leave', from: selfId }); bc.close(); },
  };

  S.isHost = asHost; S.screen = 'room'; S.status = 'connecting'; render();

  catch (e) { console.error(e); S.screen = 'lobby'; S.status = ''; toast('通信ライブラリを読み込めませんでした。ネットワークを確認してください', 'err'); render(); return; }
  S.selfId = t.selfId;
  S.diag.since = Date.now();
  t.onJoin(() => { S.diag.peers++; if (S.screen === 'room') render(); });
  t.onLeave(() => { S.diag.peers = Math.max(0, S.diag.peers - 1); });
  const A = S.A = {
    hi: t.action('hi'), lobby: t.action('lobby'), st: t.action('st'), act: t.action('act'), err: t.action('err'),
  };
  if (asHost) {
    S.hostId = t.selfId;
    H.players = [{ id: t.selfId, name: S.name }];
    try { H.rules = normRules(JSON.parse(store.get('unyo-rules') || 'null')); } catch { H.rules = defaultRules(); }
    t.onJoin(id => A.lobby.send(lobbyData(), id));
    A.hi.on((d, from) => hostOnHi(d, from));
    A.act.on((a, from) => hostAct(from, a));

    t.onJoin(id => A.hi.send({ name: S.name }, id));
    A.hi.on(() => {}); A.act.on(() => {});

      if (S.hostId && S.hostId !== from) return;
      S.hostId = from; S.lobby = d;

      render();

function genCode() {

}
function inviteUrl() {

// ---------- ホスト処理 ----------
function lobbyData() {
  const inGameIds = H.game ? new Set(H.game.players.filter(p => p.connected).map(p => p.id)) : new Set();
  return {
    hostId: S.selfId, room: S.room, rules: H.rules,
    inGame: !!(H.game && H.game.phase !== 'over'),
    players: H.players.map(p => ({ id: p.id, name: p.name, inGame: inGameIds.has(p.id) })),
  };
}
function broadcastLobby() {
  if (!S.A) return;
  S.A.lobby.send(lobbyData());
  S.lobby = lobbyData();
}
function hostOnHi(d, from) {
  const name = String((d && d.name) || '').trim().slice(0, 12) || 'プレイヤー';
  const ex = H.players.find(p => p.id === from);
  if (ex) ex.name = name;
  else {
    if (H.players.length >= 10) { S.A.err.send('満員です（最大10人）', from); return; }
    H.players.push({ id: from, name });
    toast(`${name} さんが入室しました`);
    if (H.game && H.game.phase !== 'over') S.A.err.send('ゲーム進行中です。次のラウンドから参加できます', from);
  }
  broadcastLobby();
  if (H.game && H.game.byId(from)) S.A.st.send(H.game.view(from), from);
  render();
}
function hostOnLeave(id) {
  const p = H.players.find(x => x.id === id);
  if (!p) return;
  H.players = H.players.filter(x => x.id !== id);
  if (H.game) H.game.setDisconnected(id); else toast(`${p.name} さんが退室しました`);
  broadcastLobby();
  if (H.game) broadcastState(); else render();
}
function hostStart() {
  if (H.players.length < 2) { toast('2人以上で開始できます', 'err'); return; }
  H.game = new Game(H.players, { totals: H.totals, round: H.round++, rules: H.rules });
  H.game.start();
  broadcastLobby();
  broadcastState();
}
function broadcastState() {
  const g = H.game; if (!g) return;
  for (const p of g.players) {
    if (p.id === S.selfId) continue;
    if (p.connected) S.A.st.send(g.view(p.id), p.id);
  }
  setView(g.view(S.selfId, true)); S.screen = 'game'; // 手札の確認はホストだけ
  render();
}
function hostAct(pid, a) {
  if (a && a.t === 'restart') { if (pid === S.selfId) hostStart(); return; }
  if (!H.game) return;
  const e = H.game.handle(pid, a);
  if (e) { if (pid === S.selfId) toast(e, 'err'); else S.A.err.send(e, pid); return; }
  if (H.game.phase === 'over') broadcastLobby();
  broadcastState();
}
function act(a) {
  if (S.isHost) hostAct(S.selfId, a);
  else if (S.A && S.hostId) S.A.act.send(a, S.hostId);
}

// ---------- 画面 ----------
function setView(v) {
  if (v.round !== S.seenRound) { S.seenRound = v.round; S.seenSeq = 0; }
  const fresh = v.log.filter(l => l.big && l.seq > S.seenSeq);
  if (S.seenSeq > 0 || fresh.length <= 2) fresh.slice(-3).forEach(l => toast(l.text));
  S.seenSeq = v.seq;
  if (S.seenE === null) S.seenE = v.eseq;          // 途中参加・初回は過去の演出を流さない
  if (v.eseq < S.seenE) S.seenE = 0;               // 新ラウンドでイベント番号がリセットされた
  S.fxQueue.push(...v.events.filter(e => e.seq > S.seenE));
  S.seenE = v.eseq;
  S.view = v;
}

// ---------- 演出 ----------
const FX_SYMS = new Set(['0', '3', '7', 'discard', 'skip', 'reverse', 'draw2', 'draw4', 'draw6', 'draw10', 'wild', 'drawwild']);
const FX_LABEL = { '0': '手札まわし！', '3': 'カードを渡す！', discard: 'ディスカード！', '7': '手札交換！', skip: 'スキップ！', reverse: 'リバース！', wild: 'ワイルド！', drawwild: 'ドローワイルド！' };
function fxLabel(e) {
  const dv = DRAW_VAL[e.card.sym];
  if (dv) return [`ドロー${dv}！`, e.pending > dv ? `重ねて合計 +${e.pending}` : ''];
  if (e.card.sym === 'discard') return [FX_LABEL.discard, `同じ色を ${e.dumped || 0} 枚捨てた`];
  return [FX_LABEL[e.card.sym], ''];
}
function playFx(list) {
  const now = performance.now();
  let t = Math.max(0, S.fxBusyUntil - now);
  const at = (ms, f) => setTimeout(() => { try { f(); } catch (err) { console.warn(err); } }, ms);
  for (const e of list) {
    if (e.type === 'play' && FX_SYMS.has(e.card.sym) && !e.plain) {
      const [a, b] = fxLabel(e);
      at(t, () => cutin(e.card, a, (S.view ? playerName(S.view, e.by) + ' さん' : '') + (b ? '　' + b : '')));
      t += 950;
    } else if (e.type === 'dwhit') {
      at(t, () => cutin(e.card, 'ヒット！', `${S.view ? playerName(S.view, e.pid) : ''} さん ${e.count} 枚目`));
      t += 950;
    } else if (e.type === 'draw') {
      at(t, () => flyDraw(e.pid, e.n));
      t += Math.min(e.n, 8) * 110 + 250;
    } else if (e.type === 'rotate') {
      at(t, () => e.moves.forEach(m => flyBundle(m.from, m.to)));
      t += 900;
    } else if (e.type === 'give') {
      at(t, () => { const f = seatRect(e.from), to = seatRect(e.to); fly(f, to, { rot: 0, s0: .9, s1: .7, dur: 700 }); });
      t += 750;
    } else if (e.type === 'burst') {
      at(t, () => {
        cutin(null, 'バースト！', `${S.view ? playerName(S.view, e.pid) : ''} さん 手札 ${e.n} 枚で脱落`);
        const f = seatRect(e.pid), to = document.getElementById('deck')?.getBoundingClientRect();
        for (let i = 0; i < 6; i++) fly(f, to, { delay: 300 + i * 60, dx: (i - 2.5) * 10, rot: 90, s0: .8, s1: .6, dur: 650 });
      });
      t += 1100;
    } else if (e.type === 'void') {
      at(t, () => cutin(null, '無効試合', '山札が無くなりました'));
      t += 1000;
    } else if (e.type === 'swap') {
      at(t, () => { flyBundle(e.a, e.b); flyBundle(e.b, e.a); });
      t += 900;
    }
  }
  S.fxBusyUntil = now + t;
}
function seatRect(pid) {
  const el = pid === S.selfId ? document.getElementById('hand') : document.querySelector(`.seat[data-seat="${pid}"]`);
  return el ? el.getBoundingClientRect() : null;
}
function fly(fromR, toR, o = {}) {
  if (!fromR || !toR) return;
  const el = backEl(''); el.classList.add('fly');
  document.body.append(el);
  const w = el.offsetWidth, hh = el.offsetHeight;
  const x0 = fromR.left + fromR.width / 2 - w / 2 + (o.dx || 0), y0 = fromR.top + fromR.height / 2 - hh / 2 + (o.dy || 0);
  const x1 = toR.left + toR.width / 2 - w / 2 + (o.dx || 0), y1 = toR.top + toR.height / 2 - hh / 2 + (o.dy || 0);
  const a = el.animate([
    { transform: `translate(${x0}px,${y0}px) rotate(0deg) scale(${o.s0 ?? 1})`, opacity: 1 },
    { transform: `translate(${(x0 + x1) / 2}px,${Math.min(y0, y1) - 40}px) rotate(${o.rot ?? 180}deg) scale(1.05)`, opacity: 1, offset: .5 },
    { transform: `translate(${x1}px,${y1}px) rotate(${(o.rot ?? 180) * 2}deg) scale(${o.s1 ?? .7})`, opacity: .85 },
  ], { duration: o.dur || 600, delay: o.delay || 0, easing: 'cubic-bezier(.3,.7,.3,1)', fill: 'both' });
  a.onfinish = () => el.remove();
}
function flyDraw(pid, n) {
  const from = document.getElementById('deck')?.getBoundingClientRect();
  const to = seatRect(pid);
  for (let i = 0; i < Math.min(n, 8); i++) fly(from, to, { delay: i * 110, rot: 0, s0: 1, s1: pid === S.selfId ? 1 : .55, dur: 520 });
}
function flyBundle(fromId, toId) {
  const from = seatRect(fromId), to = seatRect(toId);

}
function cutin(card, text, sub) {

function h(tag, props, ...kids) {

        `接続方式：${NET_LABEL[S.net]}`,
        S.diag.relays && `　リレー接続：${S.diag.relays}`,
        `　見つかった相手：${S.diag.peers}人`,
        S.diag.relays && S.diag.relays.startsWith('0/') && Date.now() - S.diag.since > 8000 &&
          h('div', { style: 'color:#ffb3b3' }, 'リレーに1つもつながっていません。ネットワークや広告ブロッカーを確認してください'),
        S.diag.joinErr && h('div', { style: 'color:#ffb3b3' }, `接続エラー：${S.diag.joinErr}`),
        !S.isHost && !L && Date.now() - S.diag.since > 25000 &&
          h('div', { style: 'color:#ffe08a' }, 'なかなか見つからない場合：ホストと接続方式が同じか確認し、だめなら両方とも「BitTorrent（予備）」に切り替えて作り直してください')),
      h('div', { style: 'text-align:center; margin-top:14px' }, h('button', { class: 'btn small ghost', onclick: leaveRoom }, '退出する'))));
}
// 待機画面の診断表示を定期更新
setInterval(() => { if (S.screen === 'room' && !LOCAL) render(); }, 3000);

function playerName(v, id) { return (v.players.find(p => p.id === id) || {}).name || '?'; }

function renderGame() {
  const v = S.view, me = S.selfId;
  const myIdx = v.players.findIndex(p => p.id === me);
  const n = v.players.length;
  const others = [];
  for (let k = 1; k < n; k++) others.push(v.players[(myIdx + k + n) % n]); // 自分の次から順に
  const myTurn = v.turnId === me;
  const playable = new Set(v.playable);
  const canDraw = myTurn && v.phase === 'play' && v.forced === null; // 出せるカードがあってもパスできる
  const totals = v.totals || {};

  // 手番の並び
  const order = [];
  let i = v.players.findIndex(p => p.id === v.turnId);
  for (let k = 0; k < n; k++) {
    const p = v.players[i];
    if (p.connected && !p.burst) order.push(p);
    i = (i + v.dir + n) % n;
  }

  // ステータス文
  let status = '';
  const curName = playerName(v, v.turnId);
  const meP = v.players.find(p => p.id === me);
  if (v.phase === 'over') status = v.voided ? '無効試合' : 'ラウンド終了';
  else if (meP && meP.burst) status = `💥 バーストしました。このラウンドは観戦です（${curName} さんの番）`;
  else if (v.phase === 'color') status = myTurn ? '色を選んでください' : `${curName} さんが色を選んでいます…`;
  else if (v.phase === 'dwcolor') status = myTurn ? 'ドローワイルド！宣言する色を選んでください' : `${curName} さんが色を宣言しています…（ドローワイルド）`;
  else if (v.phase === 'dwdraw') status = myTurn
    ? `「${COLOR_JA[v.dw.color]}」かレインボーが出るまで、山札をめくってください（${v.dw.count}枚めくり済み）`
    : `${curName} さんが「${COLOR_JA[v.dw.color]}」が出るまでめくっています…（${v.dw.count}枚目）`;
  else if (v.phase === 'three') status = myTurn ? '3：渡すカードと、渡す相手を選んでください' : `${curName} さんがカードを渡す相手を選んでいます…`;
  else if (v.phase === 'seven') status = myTurn ? '手札を交換する相手を選んでください' : `${curName} さんが交換相手を選んでいます…`;
  else if (myTurn) {
    if (v.forced !== null) status = '引いたカードが出せます！そのカードを出してください';
    else if (v.pending > 0) status = v.playable.length ? `ドロー${v.pendingMin}以上を重ねるか、${v.pending}枚引いてください` : `重ねられるドローカードがありません。${v.pending}枚引いてください`;
    else if (!v.playable.length) status = '出せるカードがありません。パスしてください';
    else status = 'あなたの番です！カードを出すか、パスしてください';
  } else status = `${curName} さんの番です`;

  const seat = p => {
    const hand = (v.allHands && v.allHands[p.id]) || [];
    const cards = S.debug && S.isHost
      ? hand.map(c => cardEl(c, { size: 'sm' }))
      : Array.from({ length: Math.min(p.count, 14) }, () => backEl('sm'));
    return h('div', { class: `seat ${p.id === v.turnId && v.phase !== 'over' ? 'turn' : ''} ${p.connected && !p.burst ? '' : 'off'}`, 'data-seat': p.id },
      h('div', { class: 'nm' },
        h('span', {}, p.name, !p.connected && '（切断）', p.burst && h('span', { class: 'mark' }, 'BURST')),
        h('span', { class: 'row', style: 'gap:4px' },
          p.id === v.turnId && v.unyoDeclared && h('span', { class: 'mark y' }, 'UNYO!'),
          p.id === v.unyoTarget && h('span', { class: 'mark' }, '宣言忘れ?'),
          h('span', { class: 'cnt' }, `${p.count}枚`))),
      h('div', { class: 'pts' }, `${totals[p.id] || 0} pt`),
      h('div', { class: 'fan' }, cards, !S.debug && p.count > 14 && h('span', { class: 'more' }, `+${p.count - 14}`)));
  };

  const myCards = v.hand.map(c => {
    const ok = playable.has(c.id);
    return cardEl(c, {
      playable: ok, forced: v.forced === c.id,
      dim: myTurn && v.phase === 'play' && !ok,
      onclick: ok ? () => act({ t: 'play', cardId: c.id }) : null,
    });
  });

  const dwDraw = myTurn && v.phase === 'dwdraw';
  const actions = [];
  if (dwDraw) actions.push(h('button', { class: 'btn primary', id: 'btn-dwdraw', onclick: () => act({ t: 'dwdraw' }) }, '1枚めくる'));
  const zone = [];
  if (canDraw) actions.push(h('button', { class: 'btn primary', id: 'btn-draw', onclick: () => act({ t: 'draw' }) },
    v.pending > 0 ? `${v.pending}枚引く` : 'パス（1枚引く）'));
  if (myTurn && v.phase === 'play' && v.hand.length === 2 && v.playable.length > 0)
    zone.push(v.unyoDeclared
      ? h('button', { class: 'btn', disabled: true }, 'UNYO宣言済み ✓')
      : h('button', { class: 'btn unyo', id: 'btn-unyo', onclick: () => act({ t: 'unyo' }) }, 'UNYO!'));
  if (v.unyoTarget && v.unyoTarget !== me && v.phase !== 'over')
    zone.push(h('button', { class: 'btn call', id: 'btn-callout', onclick: () => act({ t: 'callout' }) },
      `UNYO忘れ！（${playerName(v, v.unyoTarget)}）`));

  return h('div', { class: 'game' },
    h('div', { class: 'topbar' },
      h('span', { class: 'logo' }, 'UNYO'),
      h('span', { class: 'info' }, `部屋 ${S.room}　第${v.round}ラウンド${S.isHost ? '　（あなたが進行役）' : ''}`),
      h('span', { class: 'sp' }),
      S.isHost && h('button', { class: `btn small ${S.debug ? 'on' : 'ghost'}`, id: 'btn-debug', onclick: () => { S.debug = !S.debug; render(); } },
        S.debug ? '🐞 手札表示中' : '🐞 全員の手札を見る'),
      h('button', { class: `btn small ${S.showRules ? 'on' : 'ghost'}`, id: 'btn-rules', onclick: () => { S.showRules = !S.showRules; S.showLog = false; render(); } }, 'ルール'),
      h('button', { class: 'btn small ghost', id: 'btn-log', onclick: () => { S.showLog = !S.showLog; S.showRules = false; render(); } }, 'ログ'),
      h('button', { class: 'btn small ghost', onclick: leaveRoom }, '退出')),
    S.debug && S.isHost && h('div', { class: 'debugbar' }, 'デバッグ表示中：他のプレイヤーの手札が表になっています'),
    h('div', { class: 'opps' }, others.map(seat)),
    h('div', { class: 'table' },
      h('div', { class: 'piles' },
        h('div', { class: 'pile' },
          h('div', { class: `deck ${canDraw || dwDraw ? 'can' : ''}`, id: 'deck', onclick: canDraw ? () => act({ t: 'draw' }) : dwDraw ? () => act({ t: 'dwdraw' }) : null },
            v.deckCount > 1 && h('div', { class: 'stack' }, backEl('lg')),
            v.deckCount > 0 ? backEl('lg') : h('div', { class: 'card lg', style: 'background:rgba(0,0,0,.2); border-style:dashed' })),
          h('span', {}, `山札 ${v.deckCount}枚`)),
        h('div', { class: 'pile' },
          h('div', { class: 'discard', id: 'discard', style: v.color ? `box-shadow:0 0 0 4px ${COLOR_HEX[v.color]}, 0 0 24px ${COLOR_HEX[v.color]}` : '' },
            cardEl(v.top, { size: 'lg' })),
          h('span', {}, `場 ${v.discardCount}枚`)),
        h('div', { class: 'side' },
          h('div', { class: 'chip' },
            h('span', { class: 'dot', style: `background:${v.color ? COLOR_HEX[v.color] : 'conic-gradient(var(--red) 0 25%,var(--yellow) 0 50%,var(--green) 0 75%,var(--blue) 0)'}` }),
            v.color ? `場の色：${COLOR_JA[v.color]}` : '場の色：どれでもOK'),
          h('div', { class: 'chip' }, h('span', { style: 'font-size:18px; width:18px; text-align:center' }, v.dir === 1 ? '↻' : '↺'), v.dir === 1 ? '正回り' : '逆回り'),
          v.dw && v.dw.color && h('div', { class: 'chip' }, h('span', { class: 'dot', style: `background:${COLOR_HEX[v.dw.color]}` }), `宣言：${COLOR_JA[v.dw.color]}（${v.dw.count}枚目）`),
          v.pending > 0 && h('div', { class: 'pending' }, `ドロー +${v.pending}`))),
      h('div', { class: 'order' }, '順番：', order.map((p, k) => [k > 0 && '→', h('span', { class: `o ${k === 0 ? 'cur' : ''}` }, p.name)])),
      h('div', { class: 'status', id: 'status' }, status)),
    zone.length > 0 && h('div', { class: 'unyo-zone' }, zone),
    h('div', { class: `me ${myTurn && v.phase !== 'over' ? 'turn' : ''}`, 'data-seat': me },
      h('div', { class: 'mehead' },
        h('b', {}, `${S.name}（あなた）`), h('span', {}, `手札 ${v.hand.length}枚`), h('span', {}, `${totals[me] || 0} pt`),
        myTurn && v.unyoDeclared && h('span', { class: 'mark y' }, 'UNYO!')),
      h('div', { class: 'actions' }, actions),
      h('div', { class: 'hand', id: 'hand' }, myCards)),
    S.showLog && h('div', { class: 'log', id: 'log-panel' },
      h('div', { class: 'row', style: 'justify-content:space-between; margin-bottom:8px' }, h('b', {}, 'ゲームログ'),
        h('button', { class: 'btn small ghost', onclick: () => { S.showLog = false; render(); } }, '閉じる')),
      v.log.slice().reverse().map(l => h('div', { class: l.big ? 'b' : '' }, l.text))),
    S.showRules && renderRules(v.rules));
}

// ---------- ルール説明パネル ----------
const CARD_INFO = [
  ['0', '全員が、次の順番の人へ手札をまるごと渡します。'],
  ['1', '効果なし'], ['2', '効果なし'],
  ['3', '好きな相手を1人選び、自分の手札から好きなカードを1枚渡します（自分は選べません）。'],
  ['4', '効果なし'], ['5', '効果なし'], ['6', '効果なし'],
  ['7', '相手を1人指名して、その人とすぐに手札を交換します（自分は選べません）。'],
  ['8', '効果なし'], ['9', '効果なし'],
  ['skip', '次の人の番を飛ばします。'],
  ['reverse', '順番の向きが反対になります。2人で遊んでいるときは、相手の番を飛ばします。'],
  ['draw2', '次の人は2枚引きます。ドロー2以上のドロー系カードを重ねて、次の人に回すこともできます。'],
  ['discard', '手札にある同じ色のカードを全部捨てます。場の一番上はディスカードになります。これで手札が無くなればUNYO宣言は不要です。'],
  ['wild', 'どんなカードの上にも出せます。出した人が次の色を選びます。'],
  ['draw4', '次の人は4枚引きます。ドロー4以上を重ねられます。出した人が次の色を選びます。'],
  ['draw6', '次の人は6枚引きます。ドロー6以上を重ねられます。出した人が次の色を選びます。'],
  ['draw10', '次の人は10枚引きます。ドロー10を重ねられます。出した人が次の色を選びます。'],
  ['drawwild', '次の人は色を1つ宣言し、山札を1枚ずつめくります。宣言した色かレインボーが出たら、そのカードを場に出して番が終わります（そのカードの効果は発動しません）。ほかのドロー系カードは重ねられません。'],
];
function deckCounts(rules) {
  const m = {};
  for (const c of buildDeck(normRules(rules))) {
    const k = m[c.sym] || (m[c.sym] = { total: 0, colors: new Set() });
    k.total++; k.colors.add(c.color);
  }
  return m;
}
function renderRules(rules) {
  rules = normRules(rules);
  const cnt = deckCounts(rules);
  const total = Object.values(cnt).reduce((s, k) => s + k.total, 0);
  const sample = sym => cardEl({ id: -1, color: cnt[sym].colors.has('rainbow') ? 'rainbow' : 'red', sym }, { size: 'sm2' });
  const countText = sym => {
    const k = cnt[sym];
    return k.colors.has('rainbow') ? `レインボー×${k.total}枚` : `4色×${k.total / 4}枚（計${k.total}枚）`;
  };
  const sec = (title, ...items) => h('div', { class: 'rsec' }, h('h3', {}, title), h('ul', {}, items.map(t => h('li', {}, t))));
  return h('div', { class: 'log rules', id: 'rules-panel' },
    h('div', { class: 'row', style: 'justify-content:space-between; margin-bottom:6px' }, h('b', { style: 'font-size:16px' }, 'UNYO のルール'),
      h('button', { class: 'btn small ghost', onclick: () => { S.showRules = false; render(); } }, '閉じる')),
    sec('勝ち負け',
      '手札を最初に無くした人の勝ちです。',
      '勝った人は「他の人の残り手札の枚数 × 10pt」を得点にします。バーストした人は300ptとして数えます。'),
    sec('はじめ方',
      '最初の手札は1人7枚です。',
      '最初の場のカードは山札の一番上から出します。そのカードの効果は発動しません。'),
    sec('自分の番',
      '場のカードと同じ色か、同じ数字・マークのカードを1枚出せます。',
      'レインボーのカードは、場に関係なくいつでも出せます。',
      'カードを出さずにパスして1枚引くこともできます（出せるカードがあってもOK）。引いたカードが出せるなら、必ずそれを出します。出せなければ次の人の番です。'),
    sec('UNYO',
      '手札が2枚で出せるカードがあるときは、出す前に画面左下の「UNYO!」ボタンを押します。',
      '宣言せずに出すと、ほかの人の画面に「UNYO忘れ！」ボタンが出ます。押されたら2枚引きます。',
      'だれも指摘しないまま次の人が行動したら、もう指摘できません。'),
    sec('ドロー系カードの重ね',
      'ドロー系カードを出されたら、直前に出たカードと同じ枚数か、それより多いドロー系カードを重ねられます。引く枚数は足し算されていきます。',
      '重ねられない・重ねないときは、合計の枚数を引いて番が終わります。',
      'ドローワイルドは重ねることも、ほかのカードを重ねられることもありません。'),
    sec('バースト',
      '手札が25枚を超えた（26枚以上になった）瞬間に脱落します。',
      '脱落した人の手札はシャッフルして山札の下に戻し、そのラウンドの番は飛ばされます。',
      '最後に1人だけ残ったら、その人の勝ちです。'),
    sec('山札が無くなったら',
      '場の一番上の1枚を残して、ほかをシャッフルして山札に補充します。',
      '補充するカードも無いときは、そのラウンドは無効試合（得点なし）です。'),
    h('div', { class: 'rsec' }, h('h3', {}, `カード一覧（全${total}枚）`),
      h('table', { class: 'rtable' },
        CARD_INFO.filter(([sym]) => cnt[sym]).map(([sym, desc]) => h('tr', {},
          h('td', {}, sample(sym)),
          h('td', {}, h('b', {}, SYM_JA[sym] ?? sym), h('div', { class: 'rcount' }, countText(sym))),
          h('td', {}, EFFECT_NUMS.includes(sym) && !rules.effects[sym] ? '効果なし（このゲームでは特殊効果OFF）' : desc)))),
      OPTIONAL_CARDS.some(k => !cnt[k]) && h('p', { style: 'font-size:12px; opacity:.75' },
        'このゲームで使わないカード：', OPTIONAL_CARDS.filter(k => !cnt[k]).map(k => SYM_JA[k]).join('、'))));
}

function renderModal() {
  if (S.hostLost) return h('div', { class: 'overlay' }, h('div', { class: 'dialog' },
    h('h2', {}, 'ホストとの接続が切れました'),
    h('p', {}, 'ホストがタブを閉じたか、通信が切断されました。'),
    h('button', { class: 'btn primary', onclick: leaveRoom }, 'トップに戻る')));
  if (S.screen !== 'game' || !S.view) return null;
  const v = S.view, me = S.selfId, myTurn = v.turnId === me;
  if (v.phase === 'color' && myTurn) {
    return h('div', { class: 'overlay' }, h('div', { class: 'dialog' },
      h('h2', {}, '次の色を選んでください'),
      h('div', { class: 'colors' }, COLORS.map(c =>
        h('button', { style: `background:${COLOR_HEX[c]}`, 'data-color': c, onclick: () => act({ t: 'color', color: c }) }, COLOR_JA[c])))));
  }
  if (v.phase === 'dwcolor' && myTurn) {
    return h('div', { class: 'overlay' }, h('div', { class: 'dialog' },
      h('h2', {}, 'ドローワイルド！色を宣言してください'),
      h('p', { style: 'margin:-6px 0 14px; font-size:13px; opacity:.85' }, '宣言した色かレインボーが出るまで、山札をめくり続けます'),
      h('div', { class: 'colors' }, COLORS.map(c =>
        h('button', { style: `background:${COLOR_HEX[c]}`, 'data-color': c, onclick: () => act({ t: 'dwcolor', color: c }) }, COLOR_JA[c])))));
  }
  if (v.phase === 'three' && myTurn) {
    const others = v.players.filter(p => p.id !== me && p.connected && !p.burst);
    if (!v.hand.some(c => c.id === S.threeCard)) S.threeCard = null;
    return h('div', { class: 'overlay' }, h('div', { class: 'dialog', style: 'width:min(620px,100%)' },
      h('h2', {}, '3：相手に渡すカードを1枚選んでください'),
      h('div', { class: 'hand three-hand', style: 'padding-top:16px; margin-bottom:14px' }, v.hand.map(c =>
        cardEl(c, { size: 'sm2', playable: S.threeCard === c.id, dim: S.threeCard !== null && S.threeCard !== c.id,
          onclick: () => { S.threeCard = c.id; render(); } }))),
      h('h2', { style: 'font-size:16px' }, '渡す相手'),
      h('div', { class: 'targets' }, others.map(p =>
        h('button', { class: 'btn', 'data-target': p.id, disabled: S.threeCard === null,
          onclick: () => { const cardId = S.threeCard; S.threeCard = null; act({ t: 'three', target: p.id, cardId }); } },
          `${p.name}（${p.count}枚）に渡す`)))));
  }
  if (v.phase === 'seven' && myTurn) {
    return h('div', { class: 'overlay' }, h('div', { class: 'dialog' },
      h('h2', {}, '7：手札を交換する相手を指名'),
      h('div', { class: 'targets' }, v.players.filter(p => p.id !== me && p.connected && !p.burst).map(p =>
        h('button', { class: 'btn', 'data-target': p.id, onclick: () => act({ t: 'seven', target: p.id }) }, `${p.name}（${p.count}枚）`)))));
  }
  if (v.phase === 'over') {
    const rows = v.players.slice().sort((a, b) => (v.totals[b.id] || 0) - (v.totals[a.id] || 0));
    return h('div', { class: 'overlay' }, h('div', { class: 'dialog result' },
      h('div', { class: 'logo', style: 'font-size:34px' }, v.voided ? 'NO GAME' : v.winner ? 'FINISH!' : 'ROUND END'),
      v.winner
        ? h('h2', {}, `🎉 ${playerName(v, v.winner)} さんの勝ち！ +${v.roundScore}pt`)
        : h('h2', {}, v.voided ? '無効試合（得点なし）' : 'ラウンド終了'),
      v.endReason && h('p', { style: 'margin:-6px 0 6px; opacity:.85; font-size:13px' }, v.endReason),
      h('table', {},
        h('tr', {}, h('th', {}, 'プレイヤー'), h('th', {}, '残り手札'), h('th', {}, '合計pt')),
        rows.map(p => h('tr', { class: p.id === v.winner ? 'win' : '' },
          h('td', {}, p.name, p.id === me && '（あなた）'), h('td', {}, p.burst ? 'バースト（300pt）' : `${p.count}枚`), h('td', {}, `${v.totals[p.id] || 0}`)))),
      S.isHost
        ? h('button', { class: 'btn primary', id: 'btn-next', onclick: () => act({ t: 'restart' }) }, '次のラウンドへ')
        : h('p', {}, h('span', { class: 'spinner' }), 'ホストが次のラウンドを始めるのを待っています…'),
      h('div', { style: 'margin-top:10px' }, h('button', { class: 'btn small ghost', onclick: leaveRoom }, '退出する'))));
  }
  return null;
}

document.getElementById('version').textContent = 'Version ' + VERSION;
console.log('[UNYO] Version', VERSION);
render();
if (S.room) setTimeout(() => document.getElementById('code')?.focus(), 50);
// テスト用フック
window.__unyo = { S, H, act, connect };
</script>
